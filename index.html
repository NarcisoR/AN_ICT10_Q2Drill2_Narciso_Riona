<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT10 Q2 Drill2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #252d5e;
            color: #fff;
        }

        input {
            font-size: 20px;
            margin: 5px;
            padding: 5px;
            border-radius: 5px;
        }

        button {
            margin: 5px;
            padding: 5px;
            border-radius: 5px;
        }

        h1 {
            font-size: 35px;
            text-align: center;
        }

        .box {
            background-color: #1e1e2f98;
            max-width: 600px;
            padding: 20px;
            border: 4px dashed #e48960;
            border-radius: 10px;
            margin: 0 auto;
        }

        .btn-success {
            background-color: rgb(75, 159, 75);
            color: white;
        }

        .btn-danger {
            background-color: #d75050;
            color: white;
        }
    </style>
</head>

<body>

    <div class="lineup">
        <h1>Add new club member:</h1>
    </div>

    <div class="box">

        <div class="row g-3 mb-3">

            <div class="col-md-6">
                <label for="first-name">First Name</label>
                <input
                    type="text"
                    id="first-name"
                    class="form-control"
                    placeholder="Enter First Name"
                >
            </div>

            <div class="col-md-6">
                <label for="last-name">Last Name</label>
                <input
                    type="text"
                    id="last-name"
                    class="form-control"
                    placeholder="Enter Last Name"
                >
            </div>

        </div>

        <div class="d-grid mb-4">
            <button
                id="add-btn"
                py-click="add_member"
                class="btn btn-success btn-lg"
            >
                Add Member
            </button>
        </div>

        <hr>

        <div id="output" class="mt-3"></div>

    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
